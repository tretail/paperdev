schema: paperclip/v1
agents:
  tech-lead:
    adapter:
      type: claude_local
      config:
        engine: cli
        toolProfile: read_only
        requireSubscriptionAuth: true
        claudeSandbox:
          enabled: true
          isolationRoot: ~/Workspaces
  planner:
    adapter:
      type: claude_local
      config:
        engine: cli
        toolProfile: read_only
        requireSubscriptionAuth: true
        claudeSandbox:
          enabled: true
          isolationRoot: ~/Workspaces
  implementer:
    adapter:
      type: claude_local
      config:
        engine: cli
        claudePermissionMode: auto
        requireSubscriptionAuth: true
        claudeSandbox:
          enabled: true
          isolationRoot: ~/Workspaces
          allowedDomains:
            - github.com
            - api.github.com
            - uploads.github.com
            - codeload.github.com
            - objects.githubusercontent.com
            - registry.npmjs.org
        workspaceStrategy:
          type: git_worktree
routines:
  daily-discovery:
    triggers:
      - kind: schedule
        cronExpression: "0 8 * * *"
        timezone: UTC
